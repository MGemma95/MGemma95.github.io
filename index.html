<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Army Branch Survey</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0}
  main{max-width:860px;margin:auto;padding:2rem;line-height:1.4}
  h1,h2{margin:0 0 .75rem 0}
  .hidden{display:none}
  .branch-card{border:1px solid #bbb;border-radius:8px;padding:1rem;margin-bottom:1rem;
               box-shadow:2px 2px 5px rgba(0,0,0,.08)}
  button{padding:.5rem 1rem;font-size:1rem;margin:.5rem .25rem;cursor:pointer}
  progress{width:100%;height:1rem;margin:1rem 0}

<main>

      <button id="next">Next</button>
    </div>

  </section>

  <!-- RESULTS -->

    <p>Descriptions adapted from
      <a href="https://www.westpoint.edu/military-education/branch-education"
         target="_blank">West Point Branch Education</a>.
    </p>
	<button id="download">Download My Results</button>
    <button id="restart">Restart</button>
  </section>
</main>

/* ---------- BRANCH DESCRIPTIONS ------------------------------------ */
const BRANCH_DESC = {
  IN:"Infantry – The infantry Branch is the main land combat force. Infantry officers are tactical masters who plan and execute worldwide Army operations durng war and peacetime. Follow me.",

  FA:"Field Artillery – Field Artillery provides cannon, rock, and missile fire support in an operational environment, earning it the title 'King of Battle.'",
  ADA:"Air Defense Artillery – The Air Defense Artillery (ADA) branch specializes in anti-aircraft weaponry and maintains air space superiority to protect troops against aerial and missile attacks. They provide threat detection and early warnings from airspace.",
  EN:"Corps of Engineers – Engineers build structures, develop civil works programs, work with natural resources and provide construction expertise to build and maintain roads, airfields, and other facilities.",
  MP:"Military Police – The Army depends on military police to maintain order and discipline. MPs serve as the Army's law enforcement and security officers and handle crimes committed on Army installations.",
  CM:"Chemical – The Chemical Corps uses the latest defense technology to protect the force from chemical, biological, radiological, and nuclear (CBRN) weapons and weapons of mass destruction.",
  QM:"Quartermaster – The Quartermaster branch handles the logistics of providing soldiers with food, water, petroleum, repair parts, and other field services during a military or relief operation.",
  TC:"Transportation – The Transportation Branch is responsible for operating U.S. Army heavy equipment and ensuring that soldiers in the field receive the critical supplies they need to complete the mission.",
  OD:"Ordnance – The Ordnance Branch is responsible for maintaining weapons systems, vehicles, and tactical support equipment. Ordnance officers also manage the development, testing, fielding, handling, storage, and disposal of munitions.",
  FI:"Finance – Financial managers are responsible for purchasing services and supplies to sustain missions, Army pay, commerical vendor support, auditing, accounting, financial management information systems, and banking.",
  AG:"Adjutant General – The Adjutant General Corps is responsible for personnel management. AG officers provide personnel support that affects soldiers' overall welfare and well-being while assisting commanders by keeping soldiers combat-ready.",
  MS:"Medical Service Corps – The Medical Service Corps officers plan, direct, manage, administer and participate in the functioning of health care facilities and organizations. They advise commanders at all levels on aspects of heath care facilites and delivery.",
  SC:"Signal – Signal Corps is responsible for operating and maintaining the Army's data systems and resources. Their experts ensure seamless communication end-to-end, including everything from phones and computers to routers and satellite relays.",
  MI:"Military Intelligence – Military Intelligence officers provide essential information that can often save the lives of soldiers fighting on the front lines. They lead intelligence soldiers, assess risks, and act to neutralize intelligence threats.",
  CY:"Cyber – Cyber Operations officers conduct integrated and synchronized defensive and offensive cyberspace operations by targeting hostile enemy activities and capabilites."
};

/* ---------- SCORES + STATE ----------------------------------------- */
const SCORES = {
  IN:0, AR:0, AV:0, FA:0, ADA:0, EN:0, MP:0, CM:0,
  QM:0, TC:0, OD:0, FI:0, AG:0, MS:0,
  SC:0, MI:0, CY:0
};
let queue=[], history=[], answers={}, currentQ=null;

/* ---------- DOM SHORTCUTS ------------------------------------------- */
const promptEl=document.getElementById("prompt"), formEl=document.getElementById("form-area"),
      backBtn=document.getElementById("back"), nextBtn=document.getElementById("next"),
      barEl=document.getElementById("bar"), surveySec=document.getElementById("survey"),
      resultSec=document.getElementById("results"), cardsDiv=document.getElementById("cards"),
      restartBtn=document.getElementById("restart");

/* ---------- RENDER FUNCTION ----------------------------------------- */
function render(q){
  currentQ=q;
  promptEl.textContent=q.prompt;
  formEl.innerHTML="";
  q.choices.forEach((c,i)=>{
    const lab=document.createElement("label");
    const r=document.createElement("input");
    r.type="radio"; r.name="ans"; r.value=i; if(i===0) r.required=true;
    lab.append(r," ",c.label); formEl.append(lab);
  });
  backBtn.disabled=history.length<=1;
  barEl.value=history.length-1;
}

/* ---------- WEIGHT APPLICATION ------------------------------------- */
function applyWeights(choice){
  if(!choice.weights) return;
  for(const [b,pts] of Object.entries(choice.weights)){ SCORES[b]+=pts; }
}

/* ---------- NAVIGATION --------------------------------------------- */
nextBtn.onclick=()=>{
  const sel=formEl.querySelector('input[name="ans"]:checked');
  if(!sel) return;
  const idx=Number(sel.value);
  const pick=currentQ.choices[idx];
  answers[currentQ.id]=idx;

  if (currentQ === TRIAGE){
  // first ask your 10 general questions, then the division bank
  queue = GENERAL_BANK.slice().concat(BANKS[pick.tag].slice());
  barEl.max = 21;             // triage + 20 follow‑ups
} else {
  applyWeights(pick);
  }

  if(queue.length){
    const nxt=queue.shift(); history.push(nxt); render(nxt);
  } else { showResults(); }
};

backBtn.onclick=()=>{
  if(history.length<=1) return;
  queue.unshift(history.pop());
  render(history[history.length-1]);
};

  
/* ---------- RESULTS ------------------------------------------------- */
// helper to download any object as JSON
function downloadJSON(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href     = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function showResults() {
  // 1) Determine top-two branches
  const top = Object.entries(SCORES)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 2)
                    .map(x => x[0]);

  // 2) Render result cards
  cardsDiv.innerHTML = "";
  top.forEach(code => {
    const desc = BRANCH_DESC[code] || `${code} – Description coming soon`;
    const [name, detail] = desc.split(" – ");
    const card = document.createElement("div");
    card.className = "branch-card";
    card.innerHTML = `<h2>${name}</h2><p>${detail}</p>`;
    cardsDiv.append(card);
  });

  // 3) Prepare the data to download
  const resultData = {
    timestamp: new Date().toISOString(),
    answers:   answers,   // map of question IDs to choice indices
    scores:    SCORES,    // full branch score table
    topTwo:    top        // array of the top two branch codes
  };

  // 4) Wire up the Download button
  const dlBtn = document.getElementById("download");
  dlBtn.disabled = false;  // enable it
  dlBtn.onclick = () => downloadJSON(resultData, "branch_survey_results.json");

  // 5) Swap sections
  surveySec.classList.add("hidden");
  resultSec.classList.remove("hidden");
}

/* ---------- RESTART ------------------------------------------------- */
restartBtn.onclick=()=>{
  Object.keys(SCORES).forEach(k=>SCORES[k]=0); answers={}; history=[]; queue=[];
  surveySec.classList.remove("hidden"); resultSec.classList.add("hidden");
  history.push(TRIAGE); render(TRIAGE);
};

/* ---------- INIT ---------------------------------------------------- */
history.push(TRIAGE); render(TRIAGE);
